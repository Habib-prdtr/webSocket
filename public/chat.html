<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ITATS Chat</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-fade-in {
      animation: fadeIn 0.2s ease-out;
    }
    
    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    
    ::-webkit-scrollbar-track {
      background: #f1f1f1;
    }
    
    ::-webkit-scrollbar-thumb {
      background: #c1c1c1;
      border-radius: 3px;
    }
    
    ::-webkit-scrollbar-thumb:hover {
      background: #a1a1a1;
    }
    
    /* Chat bubble styles */
    .roomItem, .contactItem {
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 2px;
    }
    
    .roomItem:hover, .contactItem:hover {
      background-color: #f3f4f6;
    }
    
    .roomItem.active, .contactItem.active {
      background-color: #e0e7ff;
      color: #4f46e5;
    }
    
    /* Message bubbles */
    .message.me {
      align-self: flex-end;
      background-color: #4f46e5;
      color: white;
      border-radius: 18px 18px 4px 18px;
    }
    
    .message.other {
      align-self: flex-start;
      background-color: #e5e7eb;
      color: #1f2937;
      border-radius: 18px 18px 18px 4px;
    }

    .voice-player {
      width: 200px;
      height: 40px;
      border-radius: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    .voice-player::-webkit-media-controls-panel {
      background: transparent;
    }

    .voice-player::-webkit-media-controls-play-button {
      background-color: white;
      border-radius: 50%;
    }

    .voice-player::-webkit-media-controls-current-time-display,
    .voice-player::-webkit-media-controls-time-remaining-display {
      color: white;
      font-size: 12px;
    }

    .animate-pulse {
        animation: pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }

      /* Voice message bubble */
      .voice-bubble {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border-radius: 20px;
        padding: 12px 16px;
        max-width: 280px;
      }

      .voice-bubble-other {
        background: #f3f4f6;
        color: #374151;
        border-radius: 20px;
        padding: 12px 16px;
        max-width: 280px;
      }
    
  </style>
</head>
<body class="bg-slate-100 h-screen overflow-hidden">

<div class="flex h-full">

  <!-- SIDEBAR -->
  <aside class="w-80 bg-white border-r flex flex-col">
    <div class="p-4 border-b">
      <div class="text-xl font-bold text-indigo-600">ITATS Chat</div>
      <div class="text-sm text-slate-500" id="meInfo">—</div>
    </div>

    <!-- TABS -->
    <div class="flex border-b text-sm font-medium">
      <button 
        data-tab="rooms" 
        id="btnTabRooms" 
        class="tab-btn flex-1 py-2 text-indigo-600 border-b-2 border-indigo-600 transition-all duration-200"
      >
        Rooms
      </button>
      <button 
        data-tab="contacts" 
        id="btnTabContacts" 
        class="tab-btn flex-1 py-2 text-slate-500 transition-all duration-200"
      >
        Contacts
      </button>
      <!-- Ganti bagian badge di tab Requests menjadi: -->
      <button 
        data-tab="requests" 
        id="btnTabRequests" 
        class="tab-btn flex-1 py-2 text-slate-500 relative transition-all duration-200 group"
      >
        Requests
        <span 
          id="pendingBadge" 
          class="absolute -top-1 -right-1 min-w-[20px] h-5 bg-red-500 text-white text-xs font-bold px-1.5 rounded-full flex items-center justify-center transform transition-all duration-300 scale-100 group-hover:scale-110 shadow-lg border-2 border-white hidden"
        >
          0
        </span>
      </button>
    </div>

    <!-- TAB CONTENT CONTAINER -->
    <div id="tabContentContainer" class="flex-1 overflow-y-auto">
      
      <!-- ROOMS TAB CONTENT -->
      <div id="roomsTabContent" class="h-full">
        <div class="p-3">
          <div class="text-xs uppercase text-slate-400 mb-2">Chat Rooms</div>
          <div id="roomsList" class="space-y-1"></div>
        </div>
        
        <div class="p-3 border-t">
          <div class="flex gap-2">
            <input 
              id="newRoomName" 
              class="flex-1 border rounded px-2 py-1 text-sm focus:outline-none focus:ring-1 focus:ring-indigo-500" 
              placeholder="New room name"
            >
            <button id="btnCreateRoom" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 rounded text-sm transition-colors">
              Create
            </button>
          </div>
        </div>
      </div>

      <!-- CONTACTS TAB CONTENT -->
      <div id="contactsTabContent" class="hidden h-full">
        <div class="p-3">
          <div class="flex justify-between items-center mb-2">
            <div class="text-xs uppercase text-slate-400">My Contacts</div>
            <button 
              id="btnAddContact" 
              class="text-sm text-indigo-600 hover:text-indigo-800 transition-colors"
            >
              + Add Contact
            </button>
          </div>
          <div id="contactsList" class="space-y-1"></div>
        </div>
      </div>

      <!-- REQUESTS TAB CONTENT -->
      <div id="requestsTabContent" class="hidden h-full">
        <div class="p-3">
          <div class="text-xs uppercase text-slate-400 mb-2">Pending Requests</div>
          <div id="pendingRequests" class="space-y-2"></div>
        </div>
      </div>

    </div>

    <!-- LOGOUT -->
    <div class="p-4 border-t mt-auto">
      <div class="text-xs text-slate-400">Logged as</div>
      <div id="meName" class="font-semibold"></div>
      <button 
        id="btnLogout" 
        class="mt-2 w-full bg-red-500 hover:bg-red-600 text-white py-2 rounded transition-colors"
      >
        Logout
      </button>
    </div>
  </aside>

  <!-- CHAT AREA -->
  <main class="flex-1 flex flex-col">
    <header class="p-4 border-b bg-white flex items-center">
      <div>
        <div id="chatTitle" class="font-semibold">Global</div>
        <div id="chatSubtitle" class="text-sm text-slate-500">Public global chat</div>
      </div>

      <button 
        id="btnClearChat" 
        class="ml-auto bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded transition-colors hidden"
      >
        Bersihkan
      </button>
    </header>

    <section id="messages" class="flex-1 overflow-y-auto p-4 space-y-3 bg-slate-50 flex flex-col"></section>

    <div class="p-3 bg-white border-t flex items-center gap-2">
      <input type="file" id="imageInput" accept="image/*" class="hidden">
      <button 
        id="btnImage" 
        class="text-xl hover:bg-slate-100 p-2 rounded-full transition-colors"
      >
        🖼️
      </button>
      <button 
        id="btnVoice" 
        class="text-xl hover:bg-slate-100 p-2 rounded-full transition-colors"
      >
        🎤
      </button>

      <input
        id="messageInput"
        class="flex-1 border rounded-full px-4 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500"
        placeholder="Type a message..."
      />

      <button 
        id="btnSend" 
        class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-full transition-colors"
      >
        Send
      </button>
    </div>
  </main>
</div>

<!-- ==================== ADD CONTACT MODAL ==================== -->
<div id="addContactModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-xl shadow-xl w-full max-w-md animate-fade-in">
    
    <!-- Modal Header -->
    <div class="flex items-center justify-between p-4 border-b">
      <h3 class="text-lg font-semibold text-gray-800">Add New Contact</h3>
      <button id="btnCloseModal" class="text-gray-400 hover:text-gray-600 text-2xl">
        ×
      </button>
    </div>
    
    <!-- Modal Body -->
    <div class="p-4">
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-2">
          Search by username
        </label>
        <div class="flex gap-2">
          <input
            id="searchContactInput"
            type="text"
            class="flex-1 border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
            placeholder="Enter username..."
            autocomplete="off"
          />
          <button
            id="btnSearchContact"
            class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg transition-colors text-sm"
          >
            Search
          </button>
        </div>
        <p class="text-xs text-gray-500 mt-1">
          Enter at least 2 characters to search
        </p>
      </div>
      
      <!-- Search Results -->
      <div id="searchResults" class="max-h-60 overflow-y-auto space-y-2">
        <div class="flex items-center justify-center py-8 text-gray-400 text-sm">
          Search results will appear here
        </div>
      </div>
    </div>
    
  </div>
</div>

<!-- ==================== CALL UI ==================== -->
<div id="callContainer" class="hidden fixed inset-0 bg-black bg-opacity-70 z-50 flex items-center justify-center">
  <div class="bg-white rounded-2xl shadow-2xl p-6 w-96 text-center animate-fade-in">
    <div id="callerName" class="text-xl font-bold text-gray-800 mb-2">Calling...</div>
    <div id="callStatus" class="text-gray-600 mb-6">Connecting...</div>
    
    <div class="flex justify-center gap-4">
      <button id="btnAnswerCall" class="bg-green-500 hover:bg-green-600 text-white px-6 py-3 rounded-full text-lg">
        Answer
      </button>
      <button id="btnRejectCall" class="bg-red-500 hover:bg-red-600 text-white px-6 py-3 rounded-full text-lg">
        Reject
      </button>
      <button id="btnEndCall" class="bg-red-500 hover:bg-red-600 text-white px-6 py-3 rounded-full text-lg hidden">
        End Call
      </button>
    </div>
    
    <audio id="localAudio" class="hidden"></audio>
    <audio id="remoteAudio" class="hidden"></audio>
  </div>
</div>

<!-- ==================== RECORDING POPUP ==================== -->
<div id="recordPopup" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-2xl p-8 text-center animate-fade-in w-full max-w-sm">
    
    <!-- Recording Animation -->
    <div class="flex justify-center mb-6">
      <div class="relative w-16 h-16">
        <div class="absolute inset-0 bg-red-100 rounded-full animate-ping opacity-75"></div>
        <div class="relative w-16 h-16 bg-red-500 rounded-full flex items-center justify-center">
          <span class="text-2xl text-white">🎤</span>
        </div>
      </div>
    </div>
    
    <!-- Status -->
    <div class="text-xl font-semibold text-gray-800 mb-2">Recording Voice Message</div>
    <div id="recordTimer" class="text-4xl font-bold text-gray-800 mb-6">0:00</div>
    
    <!-- Timer Progress -->
    <div class="w-full bg-gray-200 rounded-full h-2 mb-8">
      <div id="recordProgress" class="bg-red-500 h-2 rounded-full transition-all duration-1000" style="width: 0%"></div>
    </div>
    
    <!-- Max Time Info -->
    <div class="text-sm text-gray-500 mb-6">Maximum recording time: 2 minutes</div>
    
    <!-- Action Buttons -->
    <div class="flex gap-3 justify-center">
      <button 
        id="btnCancelRecord" 
        class="flex-1 bg-gray-300 hover:bg-gray-400 text-gray-800 font-medium px-5 py-3 rounded-xl transition-colors flex items-center justify-center gap-2"
      >
        <span class="text-lg">✕</span>
        Cancel
      </button>
      
      <button 
        id="btnSendRecord" 
        class="flex-1 bg-green-500 hover:bg-green-600 text-white font-medium px-5 py-3 rounded-xl transition-colors flex items-center justify-center gap-2"
      >
        <span class="text-lg">✓</span>
        Send
      </button>
    </div>
    
    <!-- Recording Visualizer (Optional) -->
    <div class="mt-6 flex justify-center gap-1 h-8" id="audioVisualizer">
      <div class="w-1 bg-red-300 rounded-full animate-pulse"></div>
      <div class="w-1 bg-red-400 rounded-full animate-pulse" style="animation-delay: 0.1s"></div>
      <div class="w-1 bg-red-500 rounded-full animate-pulse" style="animation-delay: 0.2s"></div>
      <div class="w-1 bg-red-400 rounded-full animate-pulse" style="animation-delay: 0.3s"></div>
      <div class="w-1 bg-red-300 rounded-full animate-pulse" style="animation-delay: 0.4s"></div>
    </div>
    
  </div>
</div>

<!-- Tambahkan di chat.html -->
<button onclick="testVoiceUpload()" class="bg-red-500 text-white px-3 py-1 rounded text-xs">
  Test Voice Issue
</button>

<script>
async function testVoiceUpload() {
  console.log('🔬 Testing voice upload...');
  
  // 1. Cek apakah file tersimpan di server
  const testBlob = new Blob(['test'], { type: 'audio/webm' });
  const formData = new FormData();
  formData.append('file', testBlob, 'test.webm');
  formData.append('sender_id', window.myId);
  formData.append('type', 'private');
  formData.append('recipientId', window.state?.currentContext?.userId || 'test');
  
  try {
    const res = await fetch('/api/upload/voice', {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + window.token },
      body: formData
    });
    
    const data = await res.json();
    console.log('Upload test result:', data);
    
    // 2. Cek database untuk messages
    if (data.messageId) {
      console.log('✅ Message saved with ID:', data.messageId);
    } else {
      console.warn('⚠️ No message ID returned');
    }
    
  } catch (error) {
    console.error('Test failed:', error);
  }
}
</script>

<!-- SCRIPTS -->
<script type="module" src="./chat-config.js"></script>
<script type="module" src="./chat-ui.js"></script>
<script type="module" src="./chat-main.js"></script>

</body>
</html>
